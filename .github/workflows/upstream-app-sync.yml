name: Upstream CMFA Sync & Auto Build

on:
  schedule:
    - cron: '0 4 * * *' # Daily at 04:00 UTC
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync and build even if release tag exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Latest Upstream Tag
        id: check_upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=""
          if command -v gh >/dev/null 2>&1; then
            LATEST_TAG=$(gh api repos/MetaCubeX/ClashMetaForAndroid/releases/latest --jq '.tag_name // empty' 2>/dev/null || true)
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
              LATEST_TAG=$(gh api repos/MetaCubeX/ClashMetaForAndroid/tags --jq 'if type=="array" and length>0 then .[0].name else empty end' 2>/dev/null || true)
            fi
          fi

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            AUTH_HEADER="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
            API_HEADER="Accept: application/vnd.github+json"
            LATEST_TAG=$(curl -fsSL -H "$AUTH_HEADER" -H "$API_HEADER" https://api.github.com/repos/MetaCubeX/ClashMetaForAndroid/releases/latest 2>/dev/null | jq -r '.tag_name // empty' 2>/dev/null || true)
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
              LATEST_TAG=$(curl -fsSL -H "$AUTH_HEADER" -H "$API_HEADER" https://api.github.com/repos/MetaCubeX/ClashMetaForAndroid/tags 2>/dev/null | jq -r 'if type=="array" and length>0 then .[0].name else empty end' 2>/dev/null || true)
            fi
          fi

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "::error::Failed to fetch latest upstream CMFA tag from MetaCubeX/ClashMetaForAndroid"
            exit 1
          fi

          echo "Latest upstream CMFA tag: $LATEST_TAG"
          echo "upstream_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

          # Check if this release already exists in our repo
          MY_RELEASE=""
          if command -v gh >/dev/null 2>&1; then
            MY_RELEASE=$(gh api "repos/${{ github.repository }}/releases/tags/$LATEST_TAG" --jq '.id // empty' 2>/dev/null || true)
          else
            MY_RELEASE=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/releases/tags/$LATEST_TAG" 2>/dev/null | jq -r '.id // empty' 2>/dev/null || true)
          fi

          if [ "${{ inputs.force_sync }}" = "true" ] || [ -z "$MY_RELEASE" ] || [ "$MY_RELEASE" = "null" ]; then
            echo "New upstream version detected: $LATEST_TAG. Triggering sync."
            echo "should_sync=true" >> $GITHUB_OUTPUT
          else
            echo "Release $LATEST_TAG already exists in our repo. Everything up to date."
            echo "should_sync=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync and Merge Upstream Tag
        if: steps.check_upstream.outputs.should_sync == 'true'
        run: |
          TAG="${{ steps.check_upstream.outputs.upstream_tag }}"
          echo "Syncing upstream CMFA tag $TAG..."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save current commit hash to restore critical Chitanda files
          CURRENT_COMMIT=$(git rev-parse HEAD)

          # Add upstream remote and fetch
          git remote add upstream https://github.com/MetaCubeX/ClashMetaForAndroid.git || git remote set-url upstream https://github.com/MetaCubeX/ClashMetaForAndroid.git
          git fetch upstream --tags --force

          # Merge upstream tag into main
          git merge -X theirs "$TAG" --no-edit -m "chore(sync): sync upstream CMFA $TAG" || (git merge --abort && git checkout "$TAG" -- .)

          # Restore Chitanda-specific keystore, configs and workflows
          git checkout "$CURRENT_COMMIT" -- release.keystore .chitanda/ .github/workflows/

          # Ensure submodules are properly initialized
          git submodule update --init --recursive --force

          # Commit if needed and push
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore(sync): complete Chitanda integration for $TAG"
          fi

          git push origin main

          echo "Triggering build-release.yaml workflow..."
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-release.yaml/dispatches" \
            -d '{"ref":"main"}'
          echo "Build release workflow dispatched."
