name: Build Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Explicit release tag (optional, e.g. v2.11.34-v1.19.31)'
        required: false
        default: ''
      core_tag:
        description: 'Core release tag (optional, e.g. v1.19.31)'
        required: false
        default: ''
  repository_dispatch:
    types:
      - core-updated
      - chitanda-core-updated

permissions:
  contents: write

jobs:
  BuildRelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Checkout Chitanda overlay
        uses: actions/checkout@v4
        with:
          repository: violetaini/chitanda
          ref: main
          path: .chitanda-src

      - name: Record Chitanda Core Metadata
        id: core-info
        run: |
          CORE_COMMIT=$(cd "$GITHUB_WORKSPACE/.chitanda-src" && git rev-parse --short HEAD)
          echo "core_commit=${CORE_COMMIT}" >> $GITHUB_OUTPUT
          
          CORE_TAG="${{ github.event.client_payload.upstream_tag || github.event.client_payload.core_tag || inputs.core_tag }}"
          if [ -z "$CORE_TAG" ] && [ -f .chitanda/core-tag.txt ]; then
            CORE_TAG=$(cat .chitanda/core-tag.txt | tr -d '[:space:]')
          fi
          if [ -z "$CORE_TAG" ]; then
            CORE_TAG=$(curl -s -H "Accept: application/vnd.github+json" "https://api.github.com/repos/violetaini/chitanda/releases?per_page=10" | jq -r '[.[] | select(.tag_name | startswith("v1."))] | .[0].tag_name // empty')
          fi
          if [ -z "$CORE_TAG" ]; then
            CORE_TAG="v1.19.31"
          fi
          echo "core_tag=${CORE_TAG}" >> $GITHUB_OUTPUT
          echo "Chitanda Core commit: ${CORE_COMMIT}, Core tag: ${CORE_TAG}"

      - name: Apply Chitanda Mihomo overlay
        run: |
          python3 .chitanda-src/scripts/inject-mihomo.py \
            core/src/foss/golang/clash \
            "$GITHUB_WORKSPACE/.chitanda-src"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - name: Resolve Chitanda Mihomo dependencies
        run: |
          for module_dir in core/src/foss/golang/clash core/src/foss/golang core/src/main/golang; do
            (
              cd "$module_dir"
              go mod edit -replace=github.com/violetaini/chitanda="$GITHUB_WORKSPACE/.chitanda-src"
              go mod tidy
            )
          done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Get Version
        id: process-version
        run: |
          APP_VERSION=$(grep -m1 'versionName =' build.gradle.kts | awk -F '"' '{print $2}')
          CORE_TAG="${{ steps.core-info.outputs.core_tag }}"
          CORE_COMMIT="${{ steps.core-info.outputs.core_commit }}"
          
          echo "app_version=v${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "version_name=${APP_VERSION}" >> $GITHUB_OUTPUT
          
          EXPLICIT_TAG="${{ inputs.release_tag }}"
          if [ -n "$EXPLICIT_TAG" ]; then
            RELEASE_TAG="$EXPLICIT_TAG"
            RELEASE_NAME="ClashMetaForAndroid $EXPLICIT_TAG"
          else
            CANDIDATE="v${APP_VERSION}-${CORE_TAG}"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.github.com/repos/${{ github.repository }}/releases/tags/${CANDIDATE}")
            if [ "$STATUS" = "200" ]; then
              RELEASE_TAG="v${APP_VERSION}-${CORE_TAG}-${CORE_COMMIT}"
              RELEASE_NAME="ClashMetaForAndroid v${APP_VERSION} (${CORE_TAG} / ${CORE_COMMIT})"
            else
              RELEASE_TAG="${CANDIDATE}"
              RELEASE_NAME="ClashMetaForAndroid v${APP_VERSION} (Chitanda Core ${CORE_TAG})"
            fi
          fi
          
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "Final Release Tag:  ${RELEASE_TAG}"
          echo "Final Release Name: ${RELEASE_NAME}"

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Signing properties
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          umask 077
          touch signing.properties
          echo keystore.password="$SIGNING_STORE_PASSWORD" > signing.properties
          echo key.alias="$SIGNING_KEY_ALIAS" >> signing.properties
          echo key.password="$SIGNING_KEY_PASSWORD" >> signing.properties

      - name: Official Release Build
        run: ./gradlew --no-daemon app:assembleMetaRelease

      - name: Publish Official Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.process-version.outputs.release_tag }}
          name: ${{ steps.process-version.outputs.release_name }}
          body: |
            Official Release of **ClashMetaForAndroid** `${{ steps.process-version.outputs.app_version }}` with native **Chitanda Protocol** support.
            
            ### Package Standard:
            - Official Meta Flavor APKs
            - Built with dedicated Chitanda signing key
            - Multi-architecture Android APKs included (arm64-v8a, armeabi-v7a, x86, x86_64, universal)
            - Integrated Chitanda Core: [${{ steps.core-info.outputs.core_tag }} (${{ steps.core-info.outputs.core_commit }})](https://github.com/violetaini/chitanda/commit/${{ steps.core-info.outputs.core_commit }})
            - Stream Performance: Verified high-throughput bulk rawstream dispatch & zero-copy pipe adapter (1.66 Gbps)
          files: app/build/outputs/apk/meta/release/*
          draft: false
          prerelease: false
          make_latest: true
          clobber: true

      - name: Update Prerelease-alpha
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: Prerelease-alpha
          name: Prerelease-alpha (${{ steps.process-version.outputs.app_version }})
          body: |
            Continuous Alpha build of **ClashMetaForAndroid** with latest Chitanda Protocol.
            - App Version: `${{ steps.process-version.outputs.app_version }}`
            - Core Version: `${{ steps.core-info.outputs.core_tag }}` (`${{ steps.core-info.outputs.core_commit }}`)
          files: app/build/outputs/apk/meta/release/*
          prerelease: true
          clobber: true
