name: Watch & Sync Chitanda Core

on:
  schedule:
    - cron: '0 */2 * * *' # Check every 2 hours
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Chitanda Core Updates
        id: check_core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CORE_REPO="chitanda-project/chitanda"
          echo "Fetching latest commit and tags from $CORE_REPO..."
          
          LATEST_SHA=""
          if command -v gh >/dev/null 2>&1; then
            LATEST_SHA=$(gh api "repos/${CORE_REPO}/commits/main" --jq '.sha // empty' 2>/dev/null || true)
          fi
          
          if [ -z "$LATEST_SHA" ] || [ "$LATEST_SHA" = "null" ]; then
            LATEST_SHA=$(curl -fsSL --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${CORE_REPO}/commits/main" 2>/dev/null | jq -r '.sha // empty' 2>/dev/null || true)
          fi
          
          if [ -z "$LATEST_SHA" ] || [ "$LATEST_SHA" = "null" ]; then
            echo "Falling back to git ls-remote for commit SHA..."
            LATEST_SHA=$(git ls-remote "https://github.com/${CORE_REPO}.git" refs/heads/main 2>/dev/null | awk '{print $1}')
          fi
          
          if [ -z "$LATEST_SHA" ] || [ "$LATEST_SHA" = "null" ]; then
            echo "::warning::Failed to retrieve latest commit from $CORE_REPO. Skipping update check this cycle."
            echo "has_update=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          LATEST_TAG=""
          if command -v gh >/dev/null 2>&1; then
            LATEST_TAG=$(gh api "repos/${CORE_REPO}/releases?per_page=10" --jq '[.[] | select(.tag_name | startswith("v1."))] | .[0].tag_name // empty' 2>/dev/null || true)
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
              LATEST_TAG=$(gh api "repos/${CORE_REPO}/releases/latest" --jq '.tag_name // empty' 2>/dev/null || true)
            fi
          fi
          
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            LATEST_TAG=$(curl -fsSL --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${CORE_REPO}/releases?per_page=10" 2>/dev/null | jq -r '[.[] | select(.tag_name | startswith("v1."))] | .[0].tag_name // empty' 2>/dev/null || true)
          fi
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            LATEST_TAG=$(curl -fsSL --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${CORE_REPO}/releases/latest" 2>/dev/null | jq -r '.tag_name // empty' 2>/dev/null || true)
          fi
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Falling back to git ls-remote for tags..."
            LATEST_TAG=$(git ls-remote --tags "https://github.com/${CORE_REPO}.git" 2>/dev/null | grep -o 'refs/tags/v1\.[0-9.]*' | sed 's|refs/tags/||' | sort -V | tail -n 1)
          fi
          
          CURRENT_SHA=""
          if [ -f .chitanda/core-commit.txt ]; then
            CURRENT_SHA=$(cat .chitanda/core-commit.txt | tr -d '[:space:]')
          fi
          
          CURRENT_TAG=""
          if [ -f .chitanda/core-tag.txt ]; then
            CURRENT_TAG=$(cat .chitanda/core-tag.txt | tr -d '[:space:]')
          fi
          
          echo "Current tracked commit: '$CURRENT_SHA'"
          echo "Latest upstream commit:  '$LATEST_SHA'"
          echo "Current tracked tag:    '$CURRENT_TAG'"
          echo "Latest upstream tag:     '$LATEST_TAG'"
          
          HAS_UPDATE=false
          if [ -n "$LATEST_SHA" ] && [ "$LATEST_SHA" != "$CURRENT_SHA" ]; then
            echo "Core commit update detected!"
            HAS_UPDATE=true
          fi
          if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "$CURRENT_TAG" ]; then
            echo "Core tag update detected!"
            HAS_UPDATE=true
          fi
          
          if [ "$HAS_UPDATE" = "true" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "latest_sha=$LATEST_SHA" >> $GITHUB_OUTPUT
            echo "short_sha=${LATEST_SHA:0:7}" >> $GITHUB_OUTPUT
            echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          else
            echo "Core is up-to-date."
            echo "has_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Update Tracked Metadata and Trigger Build
        if: steps.check_core.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .chitanda
          echo "${{ steps.check_core.outputs.latest_sha }}" > .chitanda/core-commit.txt
          if [ -n "${{ steps.check_core.outputs.latest_tag }}" ]; then
            echo "${{ steps.check_core.outputs.latest_tag }}" > .chitanda/core-tag.txt
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .chitanda/core-commit.txt .chitanda/core-tag.txt
          git diff --staged --quiet || (git commit -m "chore(core): sync Chitanda core to ${{ steps.check_core.outputs.latest_tag }} (${{ steps.check_core.outputs.short_sha }})" && git pull --rebase origin main && git push origin main)
          
          echo "Triggering build-release.yaml workflow..."
          if command -v gh >/dev/null 2>&1; then
            gh workflow run build-release.yaml --ref main -f core_tag="${{ steps.check_core.outputs.latest_tag }}" || true
          else
            curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-release.yaml/dispatches" \
              -d '{"ref":"main","inputs":{"core_tag":"${{ steps.check_core.outputs.latest_tag }}"}}' || true
          fi
          echo "Build trigger step completed."
